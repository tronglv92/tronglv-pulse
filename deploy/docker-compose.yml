version: "3.9"
# Production stack: Caddy, Prometheus, Grafana + all app services
# TODO TASK-002: fill in production compose config

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    depends_on: [db, redis, kafka]

  ingest:
    build:
      context: ..
      dockerfile: DockerfileIngest
    env_file: ../.env
    depends_on: [kafka]

  worker:
    build:
      context: ..
      dockerfile: DockerfileWorker
    env_file: ../.env
    depends_on: [db, redis, kafka]

  cron:
    build:
      context: ..
      dockerfile: DockerfileCron
    env_file: ../.env
    depends_on: [db, redis, kafka]

  db:
    image: timescale/timescaledb-ha:pg15-latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulse_db
    volumes:
      - db_data:/home/postgres/pgdata/data

  redis:
    image: redis:7-alpine

  kafka:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"

volumes:
  db_data:
  caddy_data:
  caddy_config:
