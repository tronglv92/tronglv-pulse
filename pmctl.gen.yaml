# PMCTL Code Generator Configuration
# Used internally by pmctl gen commands

# Scanner settings (multi-layer aware)
scanner:
  service:
    scan_path: "internal/service"
    file_pattern: "*_service.go"
    constructor_pattern: "^New.*Service$"

  repository:
    scan_path: "internal/repository"
    file_pattern: "*_repository.go"

  handler:
    scan_path: "internal/handler"
    file_pattern: "*_handler.go"

# Generator output settings
generator:
  service_factory:
    output: "internal/service/service_factory.go"
    package: "service"

# Type to getter method mapping (shared)
type_mappings:
  suffix_rules:
    - suffix: "Repository"
      trim_suffix: true
      append: "Repo"
      prefix: "Get"

    - suffix: "Client"
      trim_suffix: false
      prefix: "Get"

  exact_rules:
    - type: "config.Config"
      method: "GetConfig"

    - type: "notify.Client"
      method: "GetNotificationClient"

    - type: "downloader.Downloader"
      method: "GetDownloader"

# Primitive and config-backed parameters
basic_types:
  types:
    - string
    - int
    - int32
    - int64
    - float32
    - float64
    - bool

  parameter_mappings: []

# Internal wiring (NOT CLI exposed)
wire:
  context_interface: "ServiceFactoryContext"
  factory_struct: "ServiceFactory"
  constructor_name: "NewServiceFactory"
  lazy_init:
    enabled: true
    package: "oncex"

# Code generation behavior
codegen:
  add_comments: true
  format_code: true
  add_generation_notice: true
  generation_notice: |
    // Code generated by pmctl. DO NOT EDIT.
    // To regenerate, run: pmctl gen service
