syntax = "proto3";

package pmcpb.protobuf;

import "google/protobuf/timestamp.proto";
import "google/protobuf/descriptor.proto";

option go_package = "dev.azure.com/PHARMACITYJSC/PharmacityLibrary/_git/pmc-inapp-helper.git/v2/pmcpb/protobuf;pmcpb";

extend google.protobuf.MethodOptions {
  string permission_code = 1000;
}

message Pagination {
  int32 limit         = 1 [json_name = "limit"];
  int32 page          = 2 [json_name = "page"];
  int32 total_page    = 4 [json_name = "total_page"];
  int64 total_records = 3 [json_name = "total_records"];
}

message AuditMetadata {
  // @gotags: json:"created_by"
  string created_by = 1 [json_name = "created_by"];
  // @gotags: json:"created_by_uid"
  string created_by_uid = 2 [json_name = "created_by_uid"];
  // @gotags: json:"updated_by"
  string updated_by = 3 [json_name = "updated_by"];
  // @gotags: json:"updated_by_uid"
  string updated_by_uid = 4 [json_name = "updated_by_uid"];
  // @gotags: json:"created_at"
  google.protobuf.Timestamp created_at = 5 [json_name = "created_at"];
  // @gotags: json:"updated_at"
  google.protobuf.Timestamp updated_at = 6 [json_name = "updated_at"];
}


message ListOptionsResponse {
  message Option {
    // @gotags: json:"uid"
    string uid = 1 [json_name = "uid"];
    // @gotags: json:"name"
    string name = 2 [json_name = "name"];
  }
  // @gotags: json:"options"
  repeated Option options = 1 [json_name = "options"];
}

message FileInfo {
  string file_name = 1 [json_name = "file_name"];
  bytes file_data = 2 [json_name = "file_data"];
}

message ExportResponse {
  oneof result {
    bytes file_data = 1;
    string error_message = 2;
  }
  // @gotags: json:"file_name"
  string file_name = 3;
}